version: 2
updates:
    - package-ecosystem: composer
      directory: /backend
      schedule:
          interval: weekly
      open-pull-requests-limit: 5

    - package-ecosystem: npm
      directory: /storefront
      schedule:
          interval: weekly
      open-pull-requests-limit: 5

    - package-ecosystem: npm
      directory: /admin
      schedule:
          interval: weekly
      open-pull-requests-limit: 5

    - package-ecosystem: docker
      directory: /docker/php
      schedule:
          interval: weekly

    - package-ecosystem: docker
      directory: /docker/nginx
      schedule:
          interval: weekly

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
