# Development environment (ARCHITECTURE.md §9.1). http://localhost:8080
#   docker compose up -d
#   docker compose exec app composer install
#   docker compose exec app php artisan migrate --seed
# Frontend dev servers (optional): docker compose --profile frontend up -d

x-php: &php
    build:
        context: .
        dockerfile: docker/php/Dockerfile
        target: dev
    image: ecommerce-php-dev
    volumes:
        - ./backend:/var/www/backend
    env_file:
        - ./backend/.env
    environment:
        DB_HOST: postgres
        REDIS_HOST: redis
        MAIL_HOST: mailpit
        MAIL_PORT: 1025
        AWS_ENDPOINT: http://minio:9000
    depends_on:
        postgres:
            condition: service_healthy
        redis:
            condition: service_healthy
    restart: unless-stopped

services:
    nginx:
        image: nginx:1.27-alpine
        ports:
            - "8080:80"
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./docker/nginx/snippets:/etc/nginx/snippets:ro
            - ./storefront/dist:/var/www/storefront:ro
            - ./admin/dist:/var/www/admin:ro
            - ./backend/public:/var/www/backend/public:ro
        depends_on:
            - app
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health/live"]
            interval: 15s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    app:
        <<: *php
        healthcheck:
            test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5

    queue:
        <<: *php
        command: php artisan queue:work redis --queue=webhooks,default,notifications --tries=3 --backoff=10 --max-time=3600 --memory=256
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f 'queue:work' > /dev/null || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3

    scheduler:
        <<: *php
        command: php artisan schedule:work
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f 'schedule:work' > /dev/null || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ecommerce
            POSTGRES_USER: ecommerce
            POSTGRES_PASSWORD: secret
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
            interval: 10s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        command: redis-server --appendonly yes
        ports:
            - "6379:6379"
        volumes:
            - redisdata:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    minio:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - miniodata:/data
        healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            interval: 10s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    minio-setup:
        image: minio/mc:latest
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: >
            /bin/sh -c "
            mc alias set local http://minio:9000 minioadmin minioadmin &&
            mc mb --ignore-existing local/ecommerce &&
            mc anonymous set download local/ecommerce/public
            "
        restart: "no"

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - "8025:8025"
            - "1025:1025"
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/livez"]
            interval: 15s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    storefront:
        profiles: ["frontend"]
        image: node:22-alpine
        working_dir: /app
        command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
        environment:
            VITE_API_PROXY_TARGET: http://nginx
        ports:
            - "5173:5173"
        volumes:
            - ./storefront:/app

    admin:
        profiles: ["frontend"]
        image: node:22-alpine
        working_dir: /app
        command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5174"
        environment:
            VITE_API_PROXY_TARGET: http://nginx
        ports:
            - "5174:5174"
        volumes:
            - ./admin:/app

volumes:
    pgdata:
    redisdata:
    miniodata:
