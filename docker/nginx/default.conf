# ARCHITECTURE.md §9.2 — single origin: storefront at /, admin at /admin, API at /api.

log_format json_combined escape=json '{"time":"$time_iso8601","request_id":"$request_id_final",'
    '"remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration":$request_time,"upstream":"$upstream_response_time","ua":"$http_user_agent"}';

# Reuse an incoming X-Request-Id, otherwise use nginx's own id.
map $http_x_request_id $request_id_final {
    default $http_x_request_id;
    ""      $request_id;
}

limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log /dev/stdout json_combined;
    error_log /dev/stderr warn;

    root /var/www/storefront;
    index index.html;
    client_max_body_size 1m;
    limit_req zone=perip burst=40 nodelay;

    include /etc/nginx/snippets/security-headers.conf;

    # ---- API and Sanctum -> Laravel -------------------------------------------------
    location ^~ /api/ {
        client_max_body_size 10m; # image uploads
        include /etc/nginx/snippets/php-fpm.conf;
    }

    location ^~ /sanctum/ {
        include /etc/nginx/snippets/php-fpm.conf;
    }

    # ---- SEO endpoints served by Laravel (Seo module) -----------------------------
    location = /sitemap.xml {
        include /etc/nginx/snippets/php-fpm.conf;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/php-fpm.conf;
    }

    # ---- Admin SPA -------------------------------------------------------------------
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/assets/ {
        alias /var/www/admin/assets/;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /admin/ {
        alias /var/www/admin/;
        try_files $uri $uri/ /admin/index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store";
    }

    # ---- Storefront SPA --------------------------------------------------------------
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Reserved storefront routes (ADR-015): static index.html, never indexed (except /busca).
    location ~ ^/(carrinho|checkout|conta|entrar|cadastro|recuperar-senha|redefinir-senha)(/.*)?$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location ~ ^/busca(/.*)?$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    # Everything else: real files (favicon, manifest...) or the SEO shell.
    location / {
        try_files $uri @seo_shell;
    }

    # ---- SEO shell (ADR-015) ------------------------------------------------------------
    # /{category-slug} and /{category-slug}/{product-slug} are rendered by Laravel
    # (Seo\ShellController): the storefront index.html with <title>, meta description,
    # canonical, OG and JSON-LD injected; unknown slug → same shell with status 404 +
    # noindex; old slug → 301. Until the Seo module ships its web.php routes, you may
    # replace the block below with `try_files /index.html =404;` (plain SPA fallback).
    location @seo_shell {
        include /etc/nginx/snippets/php-fpm.conf;
    }

    # Never serve dotfiles or other PHP entry points.
    location ~ /\. {
        deny all;
    }

    location ~ \.php$ {
        return 404;
    }
}
