# Every PHP request goes to the single front controller (never execute other .php files).
fastcgi_pass app:9000;
fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
include fastcgi_params;
fastcgi_param HTTP_X_REQUEST_ID $request_id_final;
fastcgi_param HTTP_PROXY "";
fastcgi_hide_header X-Powered-By;
fastcgi_read_timeout 30s;
fastcgi_buffers 16 16k;
fastcgi_buffer_size 32k;
